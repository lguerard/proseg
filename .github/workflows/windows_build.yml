name: Rust Build and Conda Release with Rattler-Build (Windows)

on:
  push:
    branches:
      - main
      - lguerard-patch-1
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Build project
        run: cargo build --release
